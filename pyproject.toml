[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.1.0"
description = "Extract structured career data from AI conversation exports"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
careeros = "src.cli:cli"

[tool.setuptools.packages.find]
include = ["src*"]
