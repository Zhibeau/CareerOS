name: Build APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'careeros_app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'careeros_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careeros_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      # Generate Android platform files since they're not committed
      - name: Generate Android platform
        run: flutter create --platforms android --org com.careeros .

      - name: Install dependencies
        run: flutter pub get

      # Drift requires code generation before build
      - name: Run code generation (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true # Don't block build on warnings

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: careeros-apk-${{ github.sha }}
          path: careeros_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
